# .github/workflows/pr-ci.yml
# Typecheck + build after install. Lint and test come in a later step.
# Node 22 and npm ci: docs/ci/project-ci-inventory.md
# Order: docs/ci/pipeline-design.md (install → typecheck → build)

name: PR CI

on:
  pull_request:

jobs:
  ci:
    name: Install, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
