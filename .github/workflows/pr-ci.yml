# .github/workflows/pr-ci.yml
# Install → typecheck → build → lint → test.
# Node 22 and npm: docs/ci/project-ci-inventory.md
# Script names must exist in package.json.

name: PR CI

on:
  pull_request:

jobs:
  ci:
    name: Install, typecheck, build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
