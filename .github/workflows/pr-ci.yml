# .github/workflows/pr-ci.yml
# Install → typecheck → build → lint → test.
# Node 22 and npm: docs/ci/project-ci-inventory.md
# Script names must exist in package.json.
# Triggers and concurrency: docs/ci/pipeline-design.md
# Branch-protection check name: docs/ci/branch-protection-checklist.md

name: PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# One run per PR. A new push cancels the stale run so branch protection
# sees the latest SHA, not an in-flight older commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Stable check name for Settings → Branches → required status checks.
    # Do not rename without updating docs/ci/branch-protection-checklist.md.
    name: Install, typecheck, build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
